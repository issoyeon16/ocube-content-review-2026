name: Deploy Next.js to GitHub Pages

on:
  # main 브랜치에 push하면 자동 배포
  push:
    branches:
      - main

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 실행되는 것을 방지
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # GitHub 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # GitHub Pages 환경 설정
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # package-lock.json 기준 의존성 설치
      - name: Install dependencies
        run: npm ci

      # Next.js 정적 빌드
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES_BASE_PATH: /ocube-content-review-2026

      # out 폴더를 GitHub Pages 배포 파일로 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
